name: PDF rendering
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'app/src/renderer/components/SourceDrawer.tsx'
      - 'app/src/renderer/pdf-render-status.test.mjs'
      - 'app/src/renderer/pdf-page-cache*'
      - 'app/src/renderer/styles.css'
      - 'app/package-lock.json'
      - '.github/workflows/pdf-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test src/renderer/pdf-render-status.test.mjs src/renderer/pdf-page-cache.test.mjs
        env:
          HUMANSTUDY_REQUIRE_CHROME: '1'
