name: Release

# Builds installers for a version tag (v*) and attaches them to a draft GitHub Release,
# which electron-updater reads once the release is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    # Secrets are exposed at job level so step conditions can test whether they exist.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build

      # macOS signing and notarization use repository secrets when they exist.
      - name: Prepare Apple API key
        if: runner.os == 'macOS' && env.CSC_LINK != '' && env.APPLE_API_KEY_BASE64 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER != ''
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and publish (signed)
        if: runner.os == 'macOS' && env.CSC_LINK != '' && env.APPLE_API_KEY_BASE64 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER != ''
        run: node scripts/dist.mjs ${{ matrix.target }} --publish always

      # Never attach an unsigned Mac build to the update channel. When CI credentials
      # are absent, attach locally notarized Mac artifacts before publishing the draft.
      - name: Explain manual Mac release
        if: runner.os == 'macOS' && (env.CSC_LINK == '' || env.APPLE_API_KEY_BASE64 == '' || env.APPLE_API_KEY_ID == '' || env.APPLE_API_ISSUER == '')
        run: echo 'Mac signing/notarization credentials incomplete. Upload verified notarized Mac artifacts before publishing this draft.'

      - name: Build and publish (Windows preview)
        if: runner.os == 'Windows'
        run: node scripts/dist.mjs ${{ matrix.target }} --unsigned --publish always

  # The standalone humanstudy skill (no app needed: Codex, Claude Code, OpenCode), generated from the
  # same pack, attached to the same release as humanstudy-skill.zip.
  skill:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p 'test_standalone_skill.py' -v
      - run: python scripts/build_standalone_skill.py --out dist/humanstudy --zip
      - run: mv dist/humanstudy.zip dist/humanstudy-skill.zip
      - name: Attach to the release
        run: gh release upload "${GITHUB_REF_NAME}" dist/humanstudy-skill.zip --clobber
