name: Release

# Builds installers for a version tag (v*) and attaches them to a draft GitHub Release,
# which electron-updater reads once the release is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    # Secrets are exposed at job level so step conditions can test whether they exist.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build

      # macOS signing and notarization use repository secrets when they exist.
      - name: Prepare Apple API key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and publish (signed)
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: node scripts/dist.mjs ${{ matrix.target }} --publish always

      - name: Build and publish (unsigned)
        if: runner.os != 'macOS' || env.CSC_LINK == ''
        run: node scripts/dist.mjs ${{ matrix.target }} --unsigned --publish always
