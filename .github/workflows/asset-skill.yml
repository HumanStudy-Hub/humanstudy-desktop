name: Asset skill checks
on:
  pull_request:
    paths:
      - '.agents/skills/humanstudy-opencode-assets/**'
      - 'scripts/prepare_conversion.py'
      - 'scripts/tests/test_prepare_conversion.py'
      - 'app/scripts/asset-control*'
      - 'app/scripts/opencode-assets*'
      - 'app/src/main/kernel/**'
      - 'app/src/main/runtime-core.ts'
      - 'app/src/main/opencode-install-core.ts'
      - 'app/src/shared/native.ts'
      - 'pack/**'
      - 'app/package*.json'
      - '.github/workflows/asset-skill.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix app
      - run: python -m pip install jsonschema==4.26.0
      - run: python -m unittest discover -s scripts/tests -p 'test_prepare_conversion.py' -v
      - run: node --test app/scripts/asset-control.test.mjs
      - run: node app/src/main/kernel/recovery.test.mjs
