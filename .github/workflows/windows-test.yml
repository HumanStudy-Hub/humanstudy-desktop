name: Windows tests

# The offline desktop suite, the managed-Python pack tests, a real managed-runtime install and an
# unsigned NSIS test installer, all on windows-latest. Nothing here publishes: no release, no tag,
# no update feed. The installer is a workflow artifact only.
on:
  workflow_dispatch:
  push:
    branches: ['claude/windows-ci']
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'pack/**'
      - '.github/workflows/windows-test.yml'

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      # electron-builder must never find a token, so it cannot publish even if asked to.
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
    steps:
      - name: Keep checkout bytes (no CRLF conversion)
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned runtime wheels
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary :all: -r pack/runtime/requirements.lock
          # Several tests call python3; setup-python provides it next to python.exe.
          python3 --version

      - run: npm ci

      - name: Pack Python tests
        working-directory: .
        run: |
          python -m unittest discover -s pack/runtime/tests -v
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Desktop test suite (offline; live-provider suites excluded)
        if: ${{ !cancelled() }}
        run: |
          files=$(ls src/main/*.test.mjs src/main/kernel/*.test.mjs src/renderer/*.test.mjs src/shared/*.test.mjs scripts/*.test.mjs \
            | grep -v '\.live\.test\.mjs$' | grep -v 'native-live\.test\.mjs$')
          echo "$files"
          node --test --test-concurrency=2 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../windows-tests.xml $files
        env:
          HUMANSTUDY_TEST_PYTHON: python

      - name: Managed runtime install (python-build-standalone + .cmd shims)
        if: ${{ !cancelled() }}
        run: |
          rt="$RUNNER_TEMP/hs-rt"
          node scripts/install-runtime.mjs "$rt"
          ls "$rt/bin"
          cmd //c "$(cygpath -w "$rt/bin/python.cmd")" -c "import numpy, scipy, pandas, pypdf, pdfplumber; print('runtime ok')"
          cmd //c "$(cygpath -w "$rt/bin/hs-pdf.cmd")" --help
          HUMANSTUDY_TEST_PYTHON="$(cygpath -w "$rt/python/python.exe")" node --test src/main/runtime.test.mjs

      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npx electron-vite build
        if: ${{ !cancelled() }}

      - name: Unsigned NSIS test installer (never published)
        run: node scripts/dist.mjs --win nsis --x64 --unsigned --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: HumanStudy-Hub-Setup-windows-x64-unsigned
          path: app/dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-report
          path: windows-tests.xml
          if-no-files-found: ignore
          retention-days: 7
